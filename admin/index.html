<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bravo AI Life · 수강생 관리</title>
<!--
  The teacher's page: who is on the roster and which courses each student may open.
  Published at /admin/ beside /renewal/ (put.py); it is not part of the student ZIP.
  The page itself holds no names: they are read from Firestore after the teacher signs in with Google,
  and the security rules (firestore.rules) refuse everybody who is not listed under admins/.
  The key of a student is made by ../renewal/access.js, the same code the reader uses.
  On this computer only, index.html?demo opens the page with a made-up roster and no sign-in.
-->
<style>
:root{
  --bg:#e9e9e7; --card:#fbfbfa; --ink:#1f252b; --sub:#434c55; --mute:#59636d; --line:#d5d8db; --soft:#eef0f1;
  --accent:#2c5a9c; --accent-soft:#e8eff8; --accent-line:#bfd0e6;
  --ok:#256e4e; --ok-soft:#e6f2eb; --ok-line:#bcdccb;
  --warn:#8a5206; --warn-soft:#fbf2df; --warn-line:#ecd5a4;
  --bad:#a3261e; --bad-soft:#fbeceb; --bad-line:#eec4c0;
  --top:#27292b;
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif; font-synthesis:none;
  color:var(--ink); background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh}
h1,h2,p{margin:0}
p,li,td,th{word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:16px;background:#e4e7e9;color:#2e3843}
button:hover{background:#d8dcdf}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:#244c86}
button.quiet{background:#fff;border:1px solid var(--line);font-weight:600;font-size:15px;padding:7px 12px}
button.quiet:hover{border-color:var(--accent);color:var(--accent);background:#fff}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #e39b22;outline-offset:2px}
a{color:var(--accent);text-underline-offset:4px}
input[type=text],textarea{border:2px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:17px;width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);cursor:pointer;margin:0}

.top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--top);color:#f4f4f2}
.brand{letter-spacing:2px;font-size:16px;font-weight:800;white-space:nowrap}
.brand span{font-weight:400}
.top .where{font-size:15px;color:#d3d5d6;flex:1}
.top .me{font-size:14px;color:#d3d5d6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top button{background:#3b3e41;color:#f4f4f2;font-size:14px;padding:8px 13px}
.top button:hover{background:#4a4e52}
/* minmax(0,1fr): the wide table scrolls inside its own frame and must not widen the page on a phone */
main,#desk{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card h2{font-size:20px;margin-bottom:12px}
.hint{font-size:15px;color:var(--mute);line-height:1.6}

#door{max-width:640px;margin:6vh auto 0;display:grid;gap:14px;justify-items:start}
#door h1{font-size:30px;letter-spacing:-.6px}
#door p{font-size:18px;line-height:1.7;color:var(--sub)}
#door .big{padding:15px 26px;font-size:19px;border-radius:12px}
#door code{background:var(--soft);padding:2px 7px;border-radius:6px;font-size:16px}

.lock{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lock p{flex:1;min-width:260px;font-size:17px;line-height:1.6}
.lock.is-open{background:var(--warn-soft);border-color:var(--warn-line)}
.lock b{font-weight:800}
.alarm{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);font-size:17px;line-height:1.6;font-weight:600}

.add{display:grid;grid-template-columns:minmax(120px,1.1fr) 120px auto minmax(120px,1fr) auto;gap:10px 12px;align-items:end}
.add label.f{display:grid;gap:5px;font-size:14px;font-weight:700;color:var(--sub)}
.courses{display:flex;gap:6px;align-items:center;padding-bottom:5px}
.courses label{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;white-space:nowrap}
.msg{grid-column:1/-1;min-height:24px;font-size:16px;font-weight:700;color:var(--bad)}
details{margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:16px;font-weight:700;color:var(--accent)}
.many{display:grid;gap:10px;margin-top:12px}
.many textarea{min-height:150px;line-height:1.6;resize:vertical}
.many .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0}
.bar .count{font-size:15px;color:var(--mute);flex:1;min-width:200px}
.bar input{width:220px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:17px;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:14px;color:var(--sub);background:var(--soft);font-weight:800;white-space:nowrap}
th.c,td.c{text-align:center;width:92px}
th.c label{display:grid;justify-items:center;gap:4px;cursor:pointer}
th.c small{font-weight:500;color:var(--mute);font-size:12px}
td.n{font-weight:700}
td.d{font-variant-numeric:tabular-nums;color:var(--sub);width:86px}
td.m{color:var(--sub);font-size:15.5px}
td.a{white-space:nowrap;text-align:right;width:150px}
td.a button+button{margin-left:6px}
tr.none td{color:var(--mute)}
tr.editing td{background:var(--accent-soft)}
tr.editing input[type=text]{padding:7px 9px;font-size:16px}
.empty{padding:26px;text-align:center;color:var(--mute);font-size:17px}

dialog{border:1px solid var(--line);border-radius:16px;padding:24px;max-width:min(520px,92vw);color:var(--ink);background:var(--card);box-shadow:0 30px 100px #0d1c2c55}
dialog::backdrop{background:#111a24b8}
dialog p{font-size:18px;line-height:1.7;white-space:pre-line}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16304a;color:#fff;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:600;max-width:92vw;text-align:center;z-index:10}
#toast:empty{display:none}
#toast.bad{background:var(--bad)}
[hidden]{display:none!important}

@media(max-width:760px){
  .top{padding:12px 14px;gap:10px}.top .where{display:none}.top .me{flex:1}
  main{padding:14px 10px 50px}
  .card{padding:16px 14px}
  .add{grid-template-columns:1fr 110px}
  .add .courses,.add label.memo,.add button{grid-column:1/-1}
  .courses{flex-wrap:wrap}
  .bar input{width:100%}
  th,td{padding:9px 8px;font-size:16px}
}
</style>
<script src="../renewal/access-config.js"></script>
<script src="../renewal/access.js"></script>
</head>
<body>
<header class="top"><b class="brand">BRAVO <span>AI LIFE</span></b><span class="where">수강생 관리</span><span class="me" id="me"></span><button id="leave" hidden>나가기</button></header>
<main>
 <section id="door" class="card"></section>
 <div id="desk" hidden>
  <section class="card alarm" id="alarm" hidden></section>
  <section class="card lock" id="lock"></section>
  <section class="card">
   <h2>학생 넣기</h2>
   <form class="add" id="addForm" autocomplete="off">
    <label class="f">이름<input type="text" id="addName" maxlength="30" placeholder="예: 홍길동"></label>
    <label class="f">뒷자리 네 개<input type="text" id="addDigits" inputmode="numeric" maxlength="13" placeholder="예: 1234"></label>
    <div class="courses" id="addCourses"></div>
    <label class="f memo">메모(선택)<input type="text" id="addMemo" maxlength="40" placeholder="예: 화요일 반"></label>
    <button class="primary">넣기</button>
    <p class="msg" id="addMsg" role="alert"></p>
   </form>
   <details>
    <summary>여러 명 한꺼번에 넣기</summary>
    <form class="many" id="manyForm">
     <p class="hint">한 줄에 한 명씩, 이름과 번호를 붙여 넣으세요. 엑셀에서 두 칸을 복사해도 됩니다. 휴대폰 번호 전체를 넣으면 뒷자리 네 개만 남깁니다.</p>
     <textarea id="manyText" placeholder="홍길동 1234&#10;김영희 010-1234-5678"></textarea>
     <div class="row"><div class="courses" id="manyCourses"></div><button class="primary">모두 넣기</button></div>
     <p class="msg" id="manyMsg" role="alert"></p>
    </form>
   </details>
  </section>
  <section class="card">
   <div class="bar"><h2>명단</h2><span class="count" id="count"></span><input type="text" id="find" placeholder="이름·번호·메모로 찾기" aria-label="명단에서 찾기"><button class="quiet" id="reload">새로 고침</button></div>
   <div class="scroll"><table><thead><tr><th>이름</th><th>뒷자리</th><th class="c" data-head="1"></th><th class="c" data-head="2"></th><th class="c" data-head="3"></th><th>메모</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
   <p class="hint" style="margin-top:12px">과목 칸을 누르면 바로 저장됩니다. 학생 화면에는 몇 분 안에, 학생이 화면을 새로 고치면 바로 반영됩니다. 맨 윗줄의 칸은 지금 보이는 학생 모두에게 적용합니다.</p>
  </section>
 </div>
</main>
<dialog id="ask"><p id="askText"></p><div class="row"><button id="askNo">취소</button><button id="askYes" class="primary">확인</button></div></dialog>
<output id="toast" role="status"></output>
<noscript>이 페이지는 JavaScript를 사용합니다.</noscript>
<script type="module">
const A=window.BRAVO_ACCESS,C=(A&&A.config)||{},COURSES=(A&&A.courses)||[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HERE=['localhost','127.0.0.1'].includes(location.hostname);
const DEMO=HERE&&new URLSearchParams(location.search).has('demo');   // a made-up roster, on this computer only
const SDK='https://www.gstatic.com/firebasejs/13.3.0/';
const BASE='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(C.projectId||'')+'/databases/(default)/documents/';
const tidy=s=>String(s??'').normalize('NFC').trim().replace(/\s+/g,' ');
let store=null,me=null,students=[],open=false,editing=null;

// ---------------------------------------------------------------- where the roster is kept
async function firebaseStore(){
 const [{initializeApp},au,fs]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
 const app=initializeApp({apiKey:C.apiKey,authDomain:C.authDomain,projectId:C.projectId,appId:C.appId});
 const auth=au.getAuth(app),db=fs.getFirestore(app);
 return {
  watch:f=>au.onAuthStateChanged(auth,u=>f(u?{email:u.email||'',name:u.displayName||''}:null)),
  signIn(){const p=new au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return au.signInWithPopup(auth,p);},
  signOut:()=>au.signOut(auth),
  isTeacher:async email=>(await fs.getDoc(fs.doc(db,'admins',email))).exists(),
  list:async()=>(await fs.getDocs(fs.collection(db,'roster'))).docs.map(d=>({key:d.id,memo:'',subjects:[],...d.data()})),
  // Each student is two records that must agree: roster/{key} for the teacher, access/{key} for the reader.
  // A renamed student is the old pair deleted and the new pair written in one batch.
  async save(list,gone=[]){
   const steps=[];
   for(const key of gone)steps.push(b=>{b.delete(fs.doc(db,'roster',key));b.delete(fs.doc(db,'access',key));});
   for(const s of list)steps.push(b=>{
    b.set(fs.doc(db,'roster',s.key),{name:s.name,last4:s.last4,subjects:s.subjects,memo:s.memo||'',createdAt:s.createdAt||fs.serverTimestamp(),updatedAt:fs.serverTimestamp()});
    b.set(fs.doc(db,'access',s.key),{subjects:s.subjects,updatedAt:fs.serverTimestamp()});
   });
   for(let i=0;i<steps.length;i+=200){const b=fs.writeBatch(db);steps.slice(i,i+200).forEach(f=>f(b));await b.commit();}   // 2 writes a step, 500 a batch
   for(const s of list)s.createdAt=s.createdAt||fs.Timestamp.now();
  },
  getOpen:async()=>{const d=await fs.getDoc(fs.doc(db,'settings','gate'));return d.exists()&&d.data().open===true;},
  setOpen:v=>fs.setDoc(fs.doc(db,'settings','gate'),{open:!!v,updatedAt:fs.serverTimestamp()}),
  // The one thing that must never be true: the roster readable without signing in.
  async leaks(){
   const seen=[];
   for(const name of ['roster','access']){
    try{const r=await fetch(BASE+name+'?pageSize=1',{cache:'no-store'});if(r.ok)seen.push(name);}catch(e){}
   }
   return seen;
  },
 };
}
function demoStore(){
 const who=new URLSearchParams(location.search).get('demo');let data=[],gate=false;
 const seed=[['홍길동','1234',[1],'화요일 반'],['김영희','5678',[1,2],'화요일 반'],['이철수','0000',[1,2,3],''],['박민수','4321',[],'목요일 반'],['최수진','2468',[2],'목요일 반']];
 const ready=Promise.all(seed.map(async([name,last4,subjects,memo])=>({key:await A.keyOf(name,last4),name,last4,subjects,memo}))).then(v=>{data=v;});
 const copy=s=>({...s,subjects:[...s.subjects]});
 return {
  watch:f=>{f({email:'demo@localhost',name:'미리 보기'});},
  signIn:async()=>{},signOut:async()=>{location.reload();},
  isTeacher:async()=>who!=='stranger',
  list:async()=>{await ready;return data.map(copy);},
  async save(list,gone=[]){
   if(who==='broken')throw Object.assign(new Error('demo'),{code:'unavailable'});
   data=data.filter(s=>!gone.includes(s.key)&&!list.some(x=>x.key===s.key)).concat(list.map(copy));
   window.__demoRoster=data;
  },
  getOpen:async()=>gate,setOpen:async v=>{gate=!!v;},
  leaks:async()=>[],
 };
}

// ---------------------------------------------------------------- small things
let toastTimer;
function toast(t,bad){const o=$('#toast');o.textContent=t;o.classList.toggle('bad',!!bad);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{o.textContent='';},bad?6000:2600);}
function fail(e){
 console.error(e);const code=(e&&e.code)||'';
 toast(code.includes('permission-denied')?'저장하지 못했습니다. 관리자 계정인지, 보안 규칙이 게시되어 있는지 확인하세요.'
  :code.includes('resource-exhausted')?'저장하지 못했습니다. 오늘 쓸 수 있는 무료 한도를 넘었습니다.'
  :'저장하지 못했습니다. 인터넷 연결을 확인하고 다시 해 보세요.',true);
}
function ask(text,yes){
 const d=$('#ask');$('#askText').textContent=text;$('#askYes').textContent=yes||'확인';
 return new Promise(done=>{
  const end=v=>{d.close();$('#askYes').onclick=$('#askNo').onclick=d.oncancel=null;done(v);};
  $('#askYes').onclick=()=>end(true);$('#askNo').onclick=()=>end(false);d.oncancel=e=>{e.preventDefault();end(false);};
  d.showModal();$('#askNo').focus();
 });
}
const byKey=key=>students.find(s=>s.key===key);
const courseBoxes=(id,checked)=>COURSES.map(c=>'<label><input type="checkbox" value="'+c.id+'"'+(checked.includes(c.id)?' checked':'')+'>'+c.id+'과목</label>').join('');
const picked=id=>$$('#'+id+' input:checked').map(i=>Number(i.value));
function visible(){
 const q=$('#find').value.trim(),n=A.normName(q);
 return students.filter(s=>!q||A.normName(s.name).includes(n)||s.last4.includes(q)||A.normName(s.memo).includes(n))
  .sort((a,b)=>a.name.localeCompare(b.name,'ko')||a.last4.localeCompare(b.last4));
}

// ---------------------------------------------------------------- the door: before the roster may be shown
function door(kind,detail){
 $('#desk').hidden=true;$('#door').hidden=false;$('#leave').hidden=!me;$('#me').textContent=me?me.email:'';
 const d=$('#door');
 if(kind==='loading')d.innerHTML='<h1>수강생 관리</h1><p>잠시만 기다려 주세요.</p>';
 else if(kind==='none')d.innerHTML='<h1>수강생 관리</h1><p>명단을 둘 곳이 아직 연결되지 않았습니다. Firebase 프로젝트를 만들고 그 설정값을 <code>access-config.js</code>에 넣으면 이 페이지가 열립니다.</p>';
 else if(kind==='signin'){
  d.innerHTML='<h1>수강생 관리</h1><p>관리자로 등록된 Google 계정으로 들어갑니다. 학생 명단과 학생별로 열어 줄 과목을 여기서 정합니다.</p><button class="primary big" id="enter">Google 계정으로 들어가기</button><p class="msg" id="doorMsg" role="alert"></p>';
  $('#enter').onclick=async()=>{
   $('#doorMsg').textContent='';
   try{await store.signIn();}
   catch(e){
    const code=(e&&e.code)||'';console.error(e);
    if(code.includes('popup-closed')||code.includes('cancelled-popup'))return;
    $('#doorMsg').textContent=code.includes('popup-blocked')?'브라우저가 로그인 창을 막았습니다. 주소창 오른쪽의 팝업 차단 표시를 눌러 허용한 뒤 다시 눌러 주세요.'
     :code.includes('unauthorized-domain')?'이 주소가 Firebase의 ‘승인된 도메인’에 없습니다. Authentication 설정에서 이 사이트의 주소를 추가해 주세요.'
     :'로그인하지 못했습니다. 잠시 뒤 다시 눌러 주세요. ('+code+')';
   }
  };
 }
 else if(kind==='stranger'){
  d.innerHTML='<h1>관리자 계정이 아닙니다</h1><p><b>'+esc(me.email)+'</b> 계정은 관리자로 등록되어 있지 않습니다. 관리자 계정으로 다시 들어가 주세요.</p>'+(detail?'<p class="msg">'+esc(detail)+'</p>':'')+'<button class="primary big" id="again">다른 계정으로 들어가기</button>';
  $('#again').onclick=()=>store.signOut();
 }
 else{
  d.innerHTML='<h1>명단을 열지 못했습니다</h1><p>인터넷 연결을 확인하고 다시 열어 주세요.</p><p class="hint">'+esc((detail&&(detail.code||detail.message))||'')+'</p><button class="primary big" id="retry">다시 열기</button>';
  $('#retry').onclick=()=>location.reload();
 }
}
async function arrive(user){
 me=user;
 if(!user){door('signin');return;}
 door('loading');
 try{
  if(!(await store.isTeacher(user.email))){
   // Not a teacher: the roster must refuse this account. If it answers, the rules are wrong and the teacher has to know.
   let wrong='';
   try{await store.list();wrong='주의: 관리자가 아닌 계정으로도 명단이 읽힙니다. Firebase의 보안 규칙을 다시 게시해 주세요.';}catch(e){}
   door('stranger',wrong);return;
  }
  [students,open]=await Promise.all([store.list(),store.getOpen()]);
 }catch(e){console.error(e);door('error',e);return;}
 $('#door').hidden=true;$('#desk').hidden=false;$('#leave').hidden=false;$('#me').textContent=user.email+(DEMO?' · 미리 보기(저장되지 않습니다)':'');
 editing=null;draw();
 store.leaks().then(seen=>{
  $('#alarm').hidden=!seen.length;
  if(seen.length)$('#alarm').textContent='주의: 로그인하지 않은 사람도 명단('+seen.join(', ')+')을 읽을 수 있는 상태입니다. Firebase 콘솔의 Firestore > 규칙에 firestore.rules 내용을 다시 붙여 넣고 게시해 주세요.';
 });
}

// ---------------------------------------------------------------- the roster
function draw(){
 const rows=visible(),count=c=>students.filter(s=>s.subjects.includes(c)).length;
 $('#lock').className='card lock'+(open?' is-open':'');
 $('#lock').innerHTML=open
  ?'<p><b>과목 잠금이 꺼져 있습니다.</b> 지금은 이름을 묻지 않고, 누구에게나 모든 과목이 열립니다.</p><button class="primary" id="lockButton">다시 잠그기</button>'
  :'<p><b>과목 잠금을 쓰고 있습니다.</b> 학생은 교재 첫 화면에서 이름과 휴대폰 번호 뒷자리 네 개로 들어가고, 아래에서 열어 준 과목만 봅니다.</p><button class="quiet" id="lockButton">잠금 끄기</button>';
 $('#lockButton').onclick=setLock;
 $('#count').textContent='학생 '+students.length+'명 · '+COURSES.map(c=>c.id+'과목 '+count(c.id)+'명').join(' · ')+(rows.length!==students.length?' · 보이는 학생 '+rows.length+'명':'');
 for(const c of COURSES){
  const all=rows.length>0&&rows.every(s=>s.subjects.includes(c.id));
  $('th[data-head="'+c.id+'"]').innerHTML='<label title="보이는 학생 모두에게 적용"><span>'+c.id+'과목</span><small>'+esc(c.days)+'</small><input type="checkbox" data-all="'+c.id+'"'+(all?' checked':'')+(rows.length?'':' disabled')+' aria-label="보이는 학생 모두 '+c.id+'과목"></label>';
 }
 if(!rows.length){$('#rows').innerHTML='<tr><td colspan="7" class="empty">'+(students.length?'찾는 학생이 없습니다.':'아직 학생이 없습니다. 위에서 학생을 넣어 주세요.')+'</td></tr>';return;}
 $('#rows').innerHTML=rows.map(s=>s.key===editing
  ?'<tr class="editing" data-key="'+s.key+'"><td class="n"><input type="text" data-f="name" maxlength="30" value="'+esc(s.name)+'" aria-label="이름"></td><td class="d"><input type="text" data-f="last4" inputmode="numeric" maxlength="13" value="'+esc(s.last4)+'" aria-label="뒷자리 네 개"></td>'
   +COURSES.map(c=>'<td class="c">'+(s.subjects.includes(c.id)?'✓':'')+'</td>').join('')
   +'<td class="m"><input type="text" data-f="memo" maxlength="40" value="'+esc(s.memo)+'" aria-label="메모"></td><td class="a"><button class="primary" data-do="save">저장</button><button class="quiet" data-do="cancel">취소</button></td></tr>'
  :'<tr data-key="'+s.key+'"'+(s.subjects.length?'':' class="none"')+'><td class="n">'+esc(s.name)+'</td><td class="d">'+esc(s.last4)+'</td>'
   +COURSES.map(c=>'<td class="c"><input type="checkbox" data-course="'+c.id+'"'+(s.subjects.includes(c.id)?' checked':'')+' aria-label="'+esc(s.name)+' '+c.id+'과목"></td>').join('')
   +'<td class="m">'+esc(s.memo)+'</td><td class="a"><button class="quiet" data-do="edit">수정</button><button class="quiet danger" data-do="remove">삭제</button></td></tr>').join('');
}
async function setCourse(key,course,on){
 const s=byKey(key),before=[...s.subjects];
 s.subjects=on?[...new Set([...s.subjects,course])].sort():s.subjects.filter(c=>c!==course);draw();
 try{await store.save([s]);toast(s.name+' · '+course+'과목을 '+(on?'열었습니다':'닫았습니다'));}
 catch(e){s.subjects=before;draw();fail(e);}
}
async function setAll(course,on){
 const rows=visible(),change=rows.filter(s=>s.subjects.includes(course)!==on);
 if(!change.length||!(await ask('지금 보이는 학생 '+rows.length+'명 가운데 '+change.length+'명의 '+course+'과목을 '+(on?'엽니다.':'닫습니다.'),on?'열기':'닫기'))){draw();return;}
 const before=change.map(s=>[s,[...s.subjects]]);
 change.forEach(s=>{s.subjects=on?[...new Set([...s.subjects,course])].sort():s.subjects.filter(c=>c!==course);});draw();
 try{await store.save(change);toast(change.length+'명의 '+course+'과목을 '+(on?'열었습니다':'닫았습니다'));}
 catch(e){before.forEach(([s,b])=>{s.subjects=b;});draw();fail(e);}
}
async function setLock(){
 const to=!open;
 if(!(await ask(to?'과목 잠금을 끕니다.\n이름을 묻지 않고, 누구에게나 모든 과목이 열립니다.':'과목 잠금을 다시 켭니다.\n학생은 이름과 번호로 들어가고, 열어 준 과목만 봅니다.',to?'잠금 끄기':'다시 잠그기')))return;
 try{await store.setOpen(to);open=to;draw();toast(to?'잠금을 껐습니다':'다시 잠갔습니다');}catch(e){fail(e);}
}
async function saveEdit(row){
 const s=byKey(row.dataset.key),get=f=>row.querySelector('[data-f="'+f+'"]').value;
 const name=tidy(get('name')),last4=A.normDigits(get('last4')),memo=tidy(get('memo'));
 if(!A.normName(name)){toast('이름을 입력해 주세요.',true);return;}
 if(last4.length!==4){toast('뒷자리 네 개를 모두 입력해 주세요.',true);return;}
 const key=await A.keyOf(name,last4);
 if(key!==s.key&&byKey(key)){toast('이름과 번호가 같은 학생이 이미 명단에 있습니다.',true);return;}
 const next={...s,key,name,last4,memo};
 try{await store.save([next],key!==s.key?[s.key]:[]);students[students.indexOf(s)]=next;editing=null;draw();toast(name+' · 고쳤습니다');}
 catch(e){fail(e);}
}
async function remove(key){
 const s=byKey(key);
 if(!(await ask(s.name+'('+s.last4+') 학생을 명단에서 지웁니다.\n이 학생은 더 이상 들어갈 수 없습니다.','지우기')))return;
 try{await store.save([],[key]);students=students.filter(x=>x!==s);draw();toast(s.name+' · 지웠습니다');}catch(e){fail(e);}
}
// One line of a pasted list: the words with letters are the name; the last four of all the digits are the number.
function readLine(line){
 const parts=line.split(/[\s,;]+/).filter(Boolean),words=parts.filter(t=>/[^\d\-.()+]/.test(t)),digits=parts.filter(t=>!/[^\d\-.()+]/.test(t)).join('').replace(/\D/g,'');
 return words.length&&digits.length>=4?{name:tidy(words.join(' ')),last4:digits.slice(-4)}:null;
}
async function addMany(text,subjects){
 const fresh=[],unread=[];let known=0;
 const lines=text.split(/\r?\n/);
 for(let i=0;i<lines.length;i++){
  if(!lines[i].trim())continue;
  const one=readLine(lines[i]);
  if(!one||!A.normName(one.name)){unread.push(i+1);continue;}
  const key=await A.keyOf(one.name,one.last4);
  if(byKey(key)||fresh.some(s=>s.key===key)){known++;continue;}
  fresh.push({key,...one,subjects:[...subjects],memo:''});
 }
 return {fresh,unread,known};
}

$('#addCourses').innerHTML=courseBoxes('addCourses',[1]);$('#manyCourses').innerHTML=courseBoxes('manyCourses',[1]);
$('#addForm').onsubmit=async e=>{
 e.preventDefault();
 const say=t=>{$('#addMsg').textContent=t;},name=tidy($('#addName').value),last4=A.normDigits($('#addDigits').value);
 if(!A.normName(name)){say('이름을 입력해 주세요.');$('#addName').focus();return;}
 if(last4.length!==4){say('휴대폰 번호 뒷자리 네 개를 입력해 주세요.');$('#addDigits').focus();return;}
 const key=await A.keyOf(name,last4);
 if(byKey(key)){say('이름과 번호가 같은 학생이 이미 명단에 있습니다.');return;}
 const s={key,name,last4,subjects:picked('addCourses').sort(),memo:tidy($('#addMemo').value)};
 try{await store.save([s]);students.push(s);say('');$('#addName').value=$('#addDigits').value='';draw();toast(name+' · 명단에 넣었습니다');$('#addName').focus();}
 catch(err){fail(err);}
};
$('#manyForm').onsubmit=async e=>{
 e.preventDefault();
 const say=t=>{$('#manyMsg').textContent=t;},{fresh,unread,known}=await addMany($('#manyText').value,picked('manyCourses').sort());
 const notes=(known?'\n이미 명단에 있는 '+known+'명은 건너뜁니다.':'')+(unread.length?'\n읽지 못한 줄: '+unread.join(', ')+'번째 (이름과 번호 네 자리가 있어야 합니다)':'');
 if(!fresh.length){say('넣을 학생이 없습니다.'+notes.replace(/\n/g,' '));return;}
 if(!(await ask(fresh.length+'명을 명단에 넣습니다.'+notes,'넣기')))return;
 try{await store.save(fresh);students.push(...fresh);say(unread.length?'읽지 못한 줄: '+unread.join(', ')+'번째':'');if(!unread.length)$('#manyText').value='';draw();toast(fresh.length+'명을 명단에 넣었습니다');}
 catch(err){fail(err);}
};
$('#find').oninput=()=>{editing=null;draw();};
$('#reload').onclick=async()=>{try{[students,open]=await Promise.all([store.list(),store.getOpen()]);editing=null;draw();toast('명단을 다시 읽었습니다');}catch(e){fail(e);}};
$('#leave').onclick=()=>store&&store.signOut();
$('#rows').addEventListener('change',e=>{const t=e.target;if(t.dataset.course)setCourse(t.closest('tr').dataset.key,Number(t.dataset.course),t.checked);});
$('#rows').addEventListener('click',e=>{
 const b=e.target.closest('button[data-do]');if(!b)return;
 const row=b.closest('tr'),act=b.dataset.do;
 if(act==='edit'){editing=row.dataset.key;draw();$('#rows tr.editing input').focus();}
 else if(act==='cancel'){editing=null;draw();}
 else if(act==='save')saveEdit(row);
 else if(act==='remove')remove(row.dataset.key);
});
$('#rows').addEventListener('keydown',e=>{const row=e.target.closest('tr.editing');if(!row)return;if(e.key==='Enter'){e.preventDefault();saveEdit(row);}if(e.key==='Escape'){editing=null;draw();}});
document.querySelector('thead').addEventListener('change',e=>{const t=e.target;if(t.dataset.all)setAll(Number(t.dataset.all),t.checked);});

 if(!A||!crypto.subtle){$('#door').innerHTML='<h1>수강생 관리</h1><p>이 페이지를 열 수 없습니다. 주소가 https로 시작하는지 확인해 주세요.</p>';return;}
 if(DEMO)store=demoStore();
